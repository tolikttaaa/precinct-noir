# Weekly dependency updates. Minor/patch bumps are grouped to keep PR noise low.
# Runtime lines stay on LTS (Node 24, JDK 25) and move deliberately, together with CI and Docker,
# so their majors (and the type packages tied to them) are ignored here.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the Node major we run (24 LTS in Docker and CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Upgrade together with typescript-eslint once it supports the new major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on LTS lines: Node 24 and Temurin (JDK) 25. Odd/non-LTS majors are skipped.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
