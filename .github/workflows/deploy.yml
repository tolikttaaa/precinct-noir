# Build & deploy workflow for an app repo.
# Copy to <app repo>/.github/workflows/deploy.yml and set APP_NAME below.
#
# Prerequisites (once per app):
#   1. On the server:  /srv/infra/bin/new-app.sh <app> [port]   (then commit + push home-infra)
#   2. In the app repo: a Dockerfile at the repo root.
#   3. In the app repo: Settings -> Secrets and variables -> Actions -> New repository secret
#        HOME_INFRA_DEPLOY_TOKEN = fine-grained PAT, repository access: only tolikttaaa/home-infra,
#                                  permissions: Actions = Read and write (nothing else).
#
# Flow: push to main -> `build` (GitHub-hosted) pushes ghcr.io/tolikttaaa/<app>:<sha> and :latest
#       -> `deploy` (GitHub-hosted) triggers home-infra's `deploy` workflow, which runs on the
#          self-hosted runner at home, and waits for its result.
# No app code ever runs on the home server — only the image built here.
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: precinctnoir         # must match /srv/apps/<name> on the server (lowercase)
  INFRA_REPO: tolikttaaa/home-infra

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${APP_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy on ttaaa-home and wait for the result
        env:
          GH_TOKEN: ${{ secrets.HOME_INFRA_DEPLOY_TOKEN }}
          REQUEST_ID: ${{ github.repository }}#${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # --ref skips gh's default-branch lookup, which would need Contents:read on home-infra;
          # the deploy token is deliberately limited to Actions:read/write.
          gh workflow run deploy.yml -R "$INFRA_REPO" --ref main \
            -f app="$APP_NAME" -f tag="$GITHUB_SHA" -f request_id="$REQUEST_ID"

          # Find the dispatched run by the request id in its run-name.
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list -R "$INFRA_REPO" --workflow deploy.yml --event workflow_dispatch -L 30 \
              --json databaseId,displayTitle \
              --jq "map(select(.displayTitle | contains(\"[$REQUEST_ID]\"))) | first | .databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo "::error::could not find the dispatched deploy run"; exit 1; }

          echo "Deploy run: ${GITHUB_SERVER_URL}/${INFRA_REPO}/actions/runs/${run_id}"
          gh run watch "$run_id" -R "$INFRA_REPO" --exit-status --interval 10
