# Tests and build checks for every pull request and for main.
# Deploys are handled separately by deploy.yml (push to main).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand (Actions → ci → Run workflow) with "video" ticked to keep the browser games' video even
  # when they pass. From a terminal: gh workflow run ci.yml --ref <branch> -f video=true
  workflow_dispatch:
    inputs:
      video:
        description: Keep the video of the browser games, even if they pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm:
    name: Engine & server (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Server integration tests start PostgreSQL via Testcontainers (Docker is available on the runner).
      # `check` includes `koverVerify`: the build fails if coverage drops below the floors in build.gradle.kts.
      - run: ./gradlew check koverHtmlReport --console=plain

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-reports
          path: |
            **/build/reports/tests/
            build/reports/kover/

  web:
    name: Web client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Fails if coverage drops below the thresholds in vite.config.ts.
      - run: npm run test:coverage
      - run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage/

  image:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Catches Dockerfile breakage before merge (merging to main deploys).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Browser games
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    env:
      # Slower moves and a kept video only when asked for.
      E2E_VIDEO: ${{ inputs.video && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The production image, built as the image job builds it (and from its cache).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: precinctnoir:e2e
          cache-from: type=gha

      - name: Start the server and its database
        run: docker compose -f compose.yaml up -d --wait --no-build

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium

      # A TV, a laptop and a phone (in Russian) play two rounds: the killer collapses the city and the
      # inspector wins, the VIP starts a rematch, the killer's screen reloads mid-game, and the killer wins.
      - run: npx playwright test

      - name: Put the TV and the phones side by side in one video
        if: failure() || inputs.video
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          npm run stitch

      - name: Save the server log
        if: failure()
        run: mkdir -p test-results && docker compose -f compose.yaml logs app > test-results/server.log

      - name: Upload the video and test results
        if: failure() || inputs.video
        uses: actions/upload-artifact@v7
        with:
          name: browser-games
          path: |
            e2e/videos/session.mp4
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
